# .github/workflows/build-bootstrapper.yml
name: Build Bootstrapper

on:
   push:
      branches:
         - main
      paths:
         - "bootstrapper/**"
         - ".github/workflows/build-bootstrapper.yml"
   workflow_dispatch:
   release:
      types: [published]

permissions:
   contents: write

jobs:
   build:
      name: Build all targets
      runs-on: ubuntu-latest
      steps:
         - name: Checkout
           uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

         - name: Setup Go
           uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
           with:
              go-version: "1.26.x"

         - name: Build Windows x64
           working-directory: bootstrapper
           run: |
              mkdir -p dist
              GOOS=windows GOARCH=amd64 CGO_ENABLED=0 \
                 go build -ldflags "-s -w -H=windowsgui" \
                 -o dist/calycode-installer-windows-x64.exe \
                 .

         - name: Build macOS x64
           working-directory: bootstrapper
           run: |
              GOOS=darwin GOARCH=amd64 CGO_ENABLED=0 \
                 go build -ldflags "-s -w" \
                 -o dist/calycode-installer-darwin-x64 \
                 .
              cd dist
              zip -9 calycode-installer-darwin-x64.zip calycode-installer-darwin-x64

         - name: Build macOS arm64
           working-directory: bootstrapper
           run: |
              GOOS=darwin GOARCH=arm64 CGO_ENABLED=0 \
                 go build -ldflags "-s -w" \
                 -o dist/calycode-installer-darwin-arm64 \
                 .
              cd dist
              zip -9 calycode-installer-darwin-arm64.zip calycode-installer-darwin-arm64

         - name: Generate checksums
           working-directory: bootstrapper/dist
           run: sha256sum * > SHA256SUMS

         # --- Release attachment ---
         # Triggered by changesets creating a GitHub Release after npm publish.
         # `gh release upload` attaches to the release that fired this workflow.
         - name: Attach binaries to GitHub Release
           if: github.event_name == 'release'
           env:
              GH_TOKEN: ${{ github.token }}
              RELEASE_TAG: ${{ github.event.release.tag_name }}
           run: |
              gh release upload "$RELEASE_TAG" \
                 bootstrapper/dist/calycode-installer-windows-x64.exe \
                 bootstrapper/dist/calycode-installer-darwin-x64.zip \
                 bootstrapper/dist/calycode-installer-darwin-arm64.zip \
                 bootstrapper/dist/SHA256SUMS \
                 --clobber

         # --- Floating tag ---
         # Keeps `bootstrapper-latest` pointing at HEAD so
         # dev builds are always downloadable at a stable URL.
         - name: Update bootstrapper-latest tag
           if: github.event_name == 'push'
           run: |
              git tag -f bootstrapper-latest
              git push -f origin bootstrapper-latest
