<!DOCTYPE html>
<html lang="en" data-theme="dark" data-manifest-version="%%MANIFEST_VERSION%%">
<head>
   <meta charset="UTF-8" />
   <meta name="viewport" content="width=device-width, initial-scale=1.0" />
   <title>%%TITLE%%</title>
   <meta name="description" content="%%DESCRIPTION%%" />
   <link rel="canonical" href="%%CANONICAL%%" />
   <link rel="alternate" type="text/markdown" href="%%MD_HREF%%" />
   <meta property="og:type" content="article" />
   <meta property="og:title" content="%%TITLE%%" />
   <meta property="og:description" content="%%DESCRIPTION%%" />
   <meta property="og:url" content="%%CANONICAL%%" />
   <meta name="generator" content="@calycode/cli static docs" />
   <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />
   <link href="/assets/docs.css" rel="stylesheet" />
   %%HEAD_ASSETS%%
</head>
<body class="d-body" data-current-path="%%CURRENT_PATH%%">
   <a class="d-skip" href="#d-main">Skip to content</a>
   <header class="d-header">
      <button class="d-hamburger" type="button" data-sidebar-toggle aria-label="Toggle navigation" aria-expanded="false">
         <span></span><span></span><span></span>
      </button>
      <a class="d-brand" href="/docs/">
         <img src="/assets/logo.png" alt="" width="28" height="28" />
         <span class="d-brand__name">@calycode/cli</span>
         <span class="d-brand__tag">docs</span>
      </a>
      <div class="d-header__spacer"></div>
      <a class="d-header__link" href="https://github.com/calycode/xano-tools" target="_blank" rel="noopener noreferrer">GitHub</a>
      <a class="d-header__link" href="https://links.calycode.com/discord" target="_blank" rel="noopener noreferrer">Discord</a>
      <button class="d-theme" type="button" data-theme-toggle aria-label="Toggle color theme">
         <span data-theme-icon>◐</span>
      </button>
   </header>

   <div class="d-layout">
      <aside class="d-sidebar" id="d-sidebar" aria-label="Documentation navigation">
         %%SIDEBAR%%
      </aside>
      <div class="d-sidebar__scrim" data-sidebar-close hidden></div>

      <main class="d-main" id="d-main">
         <article class="d-article">
            %%CONTENT%%
         </article>
         <nav class="d-pager" aria-label="Page navigation">
            %%PREV%%
            %%NEXT%%
         </nav>
         <footer class="d-footer">
            <span>For devs with 💖 by devs at <a href="https://calycode.com" target="_blank" rel="noopener noreferrer">calycode</a>.</span>
            <span><a href="https://links.calycode.com/discord" target="_blank" rel="noopener noreferrer">Join the Discord</a></span>
         </footer>
      </main>
   </div>

   %%BODY_ASSETS%%
   <script src="/assets/docs.js" defer></script>
   <script src="/assets/agentation.js" defer></script>
</body>
</html>
